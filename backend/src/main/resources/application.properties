# ==== Conexion a MySQL ====
# En local, si no defines las variables de entorno, usa los valores por defecto de abajo (::).
# En Render (o cualquier nube), defines estas mismas variables como "Environment Variables"
# y application.properties las toma automaticamente, SIN tocar el codigo ni el jar.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/plaza_orbita?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:1234.2}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==== JPA / Hibernate ====
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:true}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==== JWT ====
# NUNCA dejes app.jwt.secret con un valor fijo en este archivo para produccion:
# define JWT_SECRET como variable de entorno en Render con una cadena aleatoria larga.
app.jwt.secret=${JWT_SECRET:CAMBIA_ESTA_LLAVE_POR_UNA_SEGURA_DE_AL_MENOS_32_CARACTERES}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Render inyecta la variable PORT automaticamente; en local cae a 8080.
server.port=${PORT:8080}
